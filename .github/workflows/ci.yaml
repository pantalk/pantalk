name: CI

on:
  push:
    branches:
      - main
      - next
    tags-ignore:
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'configs/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - next
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'configs/**'

permissions:
  contents: read

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test
        run: go test ./... -count=1 -race

      - name: Test release build
        env:
          CGO_ENABLED: '0'
        run: go test ./... -count=1

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath ./cmd/pantalk
          CGO_ENABLED=0 go build -trimpath ./cmd/pantalkd

  cross-compile:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          for cmd in pantalk pantalkd; do
            go build -trimpath -o "${cmd}${EXT}" "./cmd/${cmd}"
          done

  container:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: pantalk/pantalk:ci
          build-args: |
            VERSION=v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          container="pantalk-ci"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" pantalk/pantalk:ci

          for attempt in $(seq 1 30); do
            if docker exec "$container" pantalk bots | grep -q 'local-test'; then
              docker exec "$container" pantalk version
              echo "Pantalk container is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Pantalk container did not become ready within 60 seconds" >&2
          docker logs --tail 100 "$container" >&2 || true
          exit 1
