server:
  # socket_path: defaults to $XDG_RUNTIME_DIR/pantalk.sock (or /tmp/pantalk-<uid>.sock)
  # db_path: defaults to ~/.local/share/pantalk/pantalk.db
  notification_history_size: 1000

  # Attachment storage (all fields optional):
  # media:
  #   backend: fs          # "fs" (default) stores files locally; "none" records
  #                        # attachment metadata without downloading any bytes
  #   path: ~/.local/share/pantalk/media   # storage root (fs backend)
  #   max_bytes: 20971520  # per-file cap, default 20 MiB
  #   attach_roots:        # directories `send --attach` may read files from;
  #     - ~/exports        # outbound attachments are DISABLED until this is
  #     - /var/lib/reports # set (allowlist-by-default, like agent commands)

# ---

bots:
  # Offline bot for exercising Pantalk's real routing, persistence, and agent
  # pipeline without provider credentials or network access.
  - name: local-test
    type: local
    # agents:
    #   - agent: engineering-assistant
    #     when: true
    #   - name: morning-review
    #     agent: engineering-assistant
    #     when: 'at("09:00") && weekday in ["mon","tue","wed","thu","fri"]'
    #     timezone: Europe/London
    #     prompt: Review the repository and summarize today's priorities.

  - name: ops-bot
    type: slack
    bot_token: $SLACK_BOT_TOKEN_OPS
    app_level_token: $SLACK_APP_LEVEL_TOKEN_OPS
    channels:
      - '#ops' # friendly name (resolved to channel ID at startup)
    # Bindings are ordered. The first matching message binding wins.
    # agents:
    #   - agent: claude-engineering
    #     when: 'channel == "#code-review"'
    #   - agent: engineering-assistant
    #     when: direct
    #   - agent: engineering-assistant
    #     when: true

  - name: eng-bot
    type: slack
    bot_token: $SLACK_BOT_TOKEN_ENG
    app_level_token: $SLACK_APP_LEVEL_TOKEN_ENG
    channels:
      - '#engineering' # friendly name – also accepts raw IDs like C0123456789

  - name: discord-bot
    type: discord
    bot_token: $DISCORD_BOT_TOKEN_OPS
    channels:
      - '#general' # friendly name (resolved to channel ID at startup)

  - name: support-bot
    type: mattermost
    bot_token: $MATTERMOST_BOT_TOKEN_SUPPORT
    endpoint: https://mattermost.example.com
    channels:
      - town-square # friendly name (resolved to channel ID at startup)

  - name: alerts-bot
    type: telegram
    bot_token: $TELEGRAM_BOT_TOKEN_ALERTS
    channels:
      - '@my_alerts_channel' # public channel username (resolved to chat ID at startup)

  - name: my-whatsapp
    type: whatsapp
    # db_path: defaults to ~/.local/share/pantalk/whatsapp-my-whatsapp.db
    # channels:               # optional: limit to specific chats
    #   - '1234567890@s.whatsapp.net'
    #   - '12345678-9876543@g.us'

  - name: irc-bot
    type: irc
    endpoint: irc.libera.chat:6697
    # password: $IRC_SERVER_PASSWORD      # optional: server password
    channels:
      - '#mychannel'

  - name: xmpp-bot
    type: xmpp
    jid: agent@example.com
    password: $XMPP_PASSWORD
    # endpoint: xmpp.example.com:5222     # optional: bypass DNS SRV discovery
    channels:
      - engineering@conference.example.com

  - name: twitch-bot
    type: twitch
    username: pantalkbot
    access_token: $TWITCH_ACCESS_TOKEN    # user token with chat:read + chat:edit
    channels:
      - pantalkdev

  - name: nostr-bot
    type: nostr
    private_key: $NOSTR_PRIVATE_KEY
    relays:
      - wss://relay.example.com
    channels:
      - nip28:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      # NIP-29 groups are relay-scoped: <relay-url>'<group-id>
      # - nip29:wss://relay.example.com'engineering

  - name: matrix-bot
    type: matrix
    access_token: $MATRIX_ACCESS_TOKEN
    endpoint: https://matrix.example.com
    channels:
      - '#general:matrix.org' # room alias (resolved to room ID at startup)

  - name: sms-bot
    type: twilio
    auth_token: $TWILIO_AUTH_TOKEN
    account_sid: $TWILIO_ACCOUNT_SID
    phone_number: '+15551234567'
    channels:
      - '+15559876543'

  - name: zulip-bot
    type: zulip
    api_key: $ZULIP_API_KEY
    bot_email: $ZULIP_BOT_EMAIL
    endpoint: https://your-org.zulipchat.com
    channels:
      - general # stream name (resolved to stream ID at startup)

  - name: my-imessage
    type: imessage
    # db_path: ~/Library/Messages/chat.db  # optional: defaults to standard location
    # channels:                            # optional: limit to specific conversations
    #   - '+15551234567'                   # DM by phone number
    #   - 'user@example.com'              # DM by email

# ---

# Top-level agents define how a reusable runtime starts. Each bot's ordered
# "agents" list defines when that bot uses the runtime. The native Codex driver
# owns one persistent app-server process and derives a durable Codex thread per
# integration conversation.
#
# agents:
#   - name: engineering-assistant         # user-chosen agent identifier
#     driver: codex                       # starts: codex app-server --stdio
#     workdir: /home/user/project         # repository Codex works in
#     timeout: 900                        # maximum seconds per turn
#     # An agent inherits nothing from the daemon, which keeps the bot tokens
#     # resolved above out of its process. Name what it needs; HOME is how the
#     # driver finds your local Codex login.
#     env_inherit: [PATH, HOME, USER, SHELL, TMPDIR, TZ, LANG, 'LC_*']
#     instructions: |
#       You are the engineering assistant for this repository.
#       Answer the user directly.
#     codex:                              # every override is optional
#       # binary: /usr/local/bin/codex    # defaults to codex on PATH
#       # model: gpt-5.4                  # otherwise inherit local config
#       # effort: high                    # sent on every turn
#       sandbox: workspace-write
#       approval_policy: never
#
#   - name: claude-engineering           # reuses local Claude Code auth/config
#     driver: claude
#     workdir: /home/user/project
#     timeout: 900
#     env_inherit: [PATH, HOME, USER, SHELL, TMPDIR, TZ, LANG, 'LC_*']
#     instructions: |
#       You are the engineering assistant for this repository.
#       Answer the user directly.
#     claude:
#       # binary: /usr/local/bin/claude  # defaults to claude on PATH
#       # model: sonnet                  # otherwise inherit local config
#       # effort: high
#       permission_mode: plan            # safe non-interactive default
#       # allowed_tools: [Read, Grep, Glob]
#       # disallowed_tools: [Edit, Write]
#
#   - name: kimi-engineering             # any Agent Client Protocol server
#     driver: acp
#     command: kimi acp                  # the ACP agent to run, exec'd directly
#     workdir: /home/user/project        # sessions are stored per workdir
#     timeout: 900
#     env_inherit: [PATH, HOME, USER, SHELL, TMPDIR, TZ, LANG, 'LC_*']
#     instructions: |
#       You are the engineering assistant for this repository.
#       Answer the user directly.
#     acp:                               # every override is optional
#       # model: kimi-k3                 # otherwise inherit the agent's config
#       # approval: reject               # reject | approve | approve-for-session
#
# "acp.model" only applies to agents that implement the protocol's unstable
# session/set_model. An agent that picks its own model logs a line saying the
# setting was ignored - configure the model on the agent instead, as zot does
# below. Note also that "approval" only constrains agents that ask permission
# before acting; a fully autonomous agent never asks, so the policy is inert
# and the agent's own sandboxing is what limits it.
#
#   - name: zot-engineering              # zot serves ACP with "zot acp"
#     driver: acp
#     command: zot acp --model kimi-k2.7-code
#     workdir: /home/user/project
#     timeout: 900
#     env_inherit: [PATH, HOME, USER, SHELL, TMPDIR, TZ, LANG, 'LC_*']
#     env:
#       CHATBOTKIT_API_SECRET: $CHATBOTKIT_API_SECRET
#     instructions: |
#       You are the engineering assistant for this repository.
#       Answer the user directly.
#
# Every driver accepts an agent-level "env" map. Entries are appended to the
# environment the agent process would otherwise inherit from the daemon, and a
# $NAME value is resolved from the daemon's own environment at startup, so a
# config can name a secret without containing one.
#
#   - name: proxied-agent
#     driver: claude                     # works for codex, acp, and command too
#     env:
#       HTTPS_PROXY: http://proxy.internal:8080
#       ANTHROPIC_AUTH_TOKEN: $API_KEY
#
# Command agents retain the original fire-and-forget CLI behavior. Only known
# agent binaries (claude, codex, aider, goose, etc.) are permitted unless
# pantalkd is started with --allow-exec. Bind command definitions from a bot's
# "agents" list in the same way as native agents.
#
#   - name: responder                     # identifier for logging
#     driver: command                     # optional when command is present
#     command: claude -p "Check pantalk notifications and respond"
#     workdir: /home/user/project          # optional working directory
#     buffer: 30                           # seconds to batch before launching
#     timeout: 120                         # kill after N seconds
#     cooldown: 60                         # min gap between runs
